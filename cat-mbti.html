<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>乌米饭 · 猫咪MBTI</title>
<style>
  :root {
    --cream: #FFF8F0;
    --orange: #F4A460;
    --orange-dark: #E8923E;
    --brown: #4A3728;
    --brown-light: #8B7355;
    --card-bg: #FFFAF5;
    --gold: #D4A853;
    --tag-bg: #FFF0E0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--cream);
    color: var(--brown);
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
  }

  .app { width: 100%; max-width: 420px; position: relative; }

  .screen { display: none; animation: fadeSlideIn 0.35s ease; }
  .screen.active { display: block; }
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Welcome */
  .welcome { text-align: center; padding: 40px 20px; }
  .mascot { font-size: 80px; margin-bottom: 12px; animation: bounce 2s infinite; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .welcome h1 { font-size: 28px; font-weight: 800; margin-bottom: 6px; }
  .welcome .subtitle { font-size: 14px; color: var(--brown-light); margin-bottom: 28px; line-height: 1.7; }

  .input-group { text-align: left; margin-bottom: 24px; }
  .input-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .input-group input {
    width: 100%; padding: 14px 16px;
    border: 2px solid #E8D5C4; border-radius: 14px;
    font-size: 16px; background: #fff; color: var(--brown);
    outline: none; transition: border-color 0.2s;
  }
  .input-group input:focus { border-color: var(--orange); }

  .btn {
    display: inline-block; padding: 14px 32px;
    border: none; border-radius: 50px;
    font-size: 16px; font-weight: 600; cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: linear-gradient(135deg, var(--orange), var(--orange-dark));
    color: #fff; box-shadow: 0 4px 16px rgba(244, 164, 96, 0.35);
  }
  .btn-block { width: 100%; }

  /* Quiz */
  .quiz-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .quiz-header .step { font-size: 13px; color: var(--brown-light); white-space: nowrap; }
  .progress-bar { flex: 1; height: 6px; background: #E8D5C4; border-radius: 3px; overflow: hidden; }
  .progress-bar .fill { height: 100%; background: var(--orange); border-radius: 3px; transition: width 0.3s; }

  .question-card {
    background: #fff; border-radius: 20px; padding: 28px 22px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04); margin-bottom: 16px;
  }
  .question-card .dim-badge {
    display: inline-block; font-size: 11px; padding: 3px 10px;
    background: var(--tag-bg); border-radius: 50px;
    color: var(--brown-light); margin-bottom: 12px;
  }
  .question-card .emoji { font-size: 44px; margin-bottom: 12px; }
  .question-card .q-text { font-size: 17px; font-weight: 600; line-height: 1.6; margin-bottom: 20px; }

  .options { display: flex; flex-direction: column; gap: 8px; }
  .option {
    width: 100%; padding: 14px 16px;
    background: var(--card-bg); border: 2px solid transparent;
    border-radius: 14px; font-size: 14px; color: var(--brown);
    cursor: pointer; text-align: left;
    transition: all 0.15s; display: flex; align-items: center; gap: 10px;
  }
  .option .opt-emoji { font-size: 22px; flex-shrink: 0; }
  .option:active { transform: scale(0.98); background: #FFF0E0; border-color: var(--orange); }

  /* Result */
  .result { text-align: center; padding: 20px 0; }
  .result-type {
    font-size: 13px; color: var(--orange-dark); font-weight: 700;
    letter-spacing: 2px; margin-bottom: 6px;
  }
  .result-name { font-size: 34px; font-weight: 800; margin-bottom: 2px; }
  .result-role { font-size: 15px; color: var(--brown-light); margin-bottom: 20px; }
  .result-desc {
    background: #fff; border-radius: 16px; padding: 18px 22px;
    font-size: 14px; line-height: 1.8; color: var(--brown-light);
    text-align: left; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  }
  .cat-say {
    background: linear-gradient(135deg, #FFF5E8, #FFEDD8);
    border-left: 3px solid var(--orange);
    border-radius: 0 12px 12px 0; padding: 12px 16px;
    font-size: 14px; font-style: italic; color: var(--brown);
    text-align: left; margin-bottom: 18px;
  }
  .cat-say::before { content: '💬 '; }

  .score-bars { margin-bottom: 20px; text-align: left; }
  .score-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px; font-size: 12px; color: var(--brown-light);
  }
  .score-row .bar-wrap {
    flex: 1; height: 8px; background: #F0E8DC; border-radius: 4px; overflow: hidden;
    display: flex;
  }
  .score-row .bar-left { height: 100%; background: var(--orange); border-radius: 4px 0 0 4px; transition: width 0.5s; }
  .score-row .bar-right { height: 100%; background: #D4C4B0; border-radius: 0 4px 4px 0; }
  .score-row .dim-label { width: 28px; font-weight: 700; text-align: center; }
  .score-row .dim-label.winner { color: var(--orange-dark); }

  .traits { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 24px; }
  .trait { padding: 8px 16px; background: var(--tag-bg); border-radius: 50px; font-size: 13px; font-weight: 500; }

  .tips-section { margin-bottom: 24px; text-align: left; }
  .tips-title { font-size: 15px; font-weight: 700; color: var(--brown); margin-bottom: 12px; text-align: center; }
  .tip-item {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 12px 16px; background: #fff; border-radius: 12px;
    margin-bottom: 8px; font-size: 13px; line-height: 1.7; color: var(--brown-light);
    box-shadow: 0 1px 4px rgba(0,0,0,0.03);
  }
  .tip-item .tip-emoji { font-size: 20px; flex-shrink: 0; margin-top: 1px; }

  /* ID Card */
  .id-card-section { margin-bottom: 24px; }
  .id-card-section .section-title { font-size: 12px; color: var(--brown-light); margin-bottom: 10px; letter-spacing: 1px; text-transform: uppercase; }
  .id-card {
    background: linear-gradient(145deg, #FFFEF9, #FFF8EE);
    border: 3px solid var(--gold); border-radius: 20px;
    padding: 22px 20px; box-shadow: 0 4px 20px rgba(212,168,83,0.2);
  }
  .id-card-body { display: flex; gap: 16px; align-items: center; }
  .photo-area {
    width: 85px; height: 85px; border-radius: 16px;
    background: var(--tag-bg); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; cursor: pointer;
    border: 2px dashed #E8D5C4; transition: border-color 0.2s;
  }
  .photo-area:hover { border-color: var(--orange); }
  .photo-area img { width: 100%; height: 100%; object-fit: cover; }
  .photo-area .placeholder { font-size: 32px; opacity: 0.5; }
  .info { flex: 1; }
  .info .cat-name { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .info .cat-type { display: inline-block; font-size: 12px; font-weight: 600; color: var(--orange-dark); background: var(--tag-bg); padding: 3px 10px; border-radius: 50px; margin-bottom: 6px; }
  .info .cat-oneliner { font-size: 12px; color: var(--brown-light); line-height: 1.6; }
  .info .meta { font-size: 11px; color: var(--brown-light); line-height: 1.9; }
  .id-card-footer { margin-top: 18px; padding-top: 14px; border-top: 1px dashed #E8D5C4; display: flex; justify-content: space-between; font-size: 10px; color: #C4A882; }

  .btn-secondary { background: #fff; color: var(--brown); border: 2px solid #E8D5C4; margin-top: 10px; }
  .actions { display: flex; gap: 10px; justify-content: center; }
  .actions .btn { flex: 1; padding: 14px 12px; font-size: 14px; }

  /* Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 100;
    justify-content: center; align-items: center; padding: 24px;
  }
  .modal-overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 20px; padding: 28px 24px; width: 100%; max-width: 340px; text-align: center; }
  .modal h3 { margin-bottom: 12px; font-size: 18px; }
  .modal .btn { margin-top: 10px; width: 100%; }
  .modal input[type="file"] { display: none; }
</style>
</head>
<body>

<div class="app">
  <!-- ===== WELCOME ===== -->
  <div class="screen active" id="screen-welcome">
    <div class="welcome">
      <div class="mascot">🐱</div>
      <h1>猫咪 MBTI</h1>
      <p class="subtitle">20道题目，测测你家主子的真实猫格，生成专属身份证 🪪</p>
      <div class="input-group">
        <label>你家猫咪的名字</label>
        <input type="text" id="catNameInput" placeholder="比如：小咪" maxlength="20">
      </div>
      <button class="btn btn-primary btn-block" onclick="startQuiz()">开始测试 🐾</button>
    </div>
  </div>

  <!-- ===== QUIZ ===== -->
  <div class="screen" id="screen-quiz">
    <div class="quiz-header">
      <span class="step" id="stepText">1/20</span>
      <div class="progress-bar"><div class="fill" id="progressFill" style="width:0%"></div></div>
    </div>
    <div class="question-card">
      <div class="dim-badge" id="dimBadge"></div>
      <div class="emoji" id="qEmoji"></div>
      <div class="q-text" id="qText"></div>
      <div class="options" id="optionsEl"></div>
    </div>
  </div>

  <!-- ===== RESULT ===== -->
  <div class="screen" id="screen-result">
    <div class="result">
      <div class="result-type" id="resultType"></div>
      <div class="result-name" id="resultName"></div>
      <div class="result-role" id="resultRole"></div>
      <div class="result-desc" id="resultDesc"></div>
      <div class="cat-say" id="catSay"></div>
      <div class="score-bars" id="scoreBars"></div>
      <div class="tips-section" id="tipsSection"></div>
      <div class="traits" id="traitsEl"></div>

      <div class="id-card-section">
        <div class="section-title">🐱 猫格身份证</div>
        <div class="id-card" id="idCard">
          <div class="id-card-body">
            <div class="photo-area" id="photoArea" onclick="showPhotoModal()">
              <span class="placeholder">📷</span>
            </div>
            <div class="info">
              <div class="cat-name" id="cardCatName">—</div>
              <div class="cat-type" id="cardType">—</div>
              <div class="cat-oneliner" id="cardOneliner"></div>
            </div>
          </div>
          <div class="id-card-footer">
            <span id="cardDate"></span>
            <span style="cursor:pointer;color:var(--orange-dark);font-weight:600" onclick="downloadCard()">⬇ 下载身份证</span>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-secondary" onclick="restartQuiz()">🔄 重测</button>
        <button class="btn btn-primary" onclick="shareCard()">📤 分享卡片</button>
      </div>
    </div>
  </div>

  <!-- Photo Modal -->
  <div class="modal-overlay" id="photoModal">
    <div class="modal">
      <h3>上传猫咪照片</h3>
      <p style="font-size:14px;color:var(--brown-light);margin-bottom:14px;">选一张主子的靓照做证件</p>
      <input type="file" id="photoInput" accept="image/*" onchange="handlePhotoSelect(event)">
      <button class="btn btn-primary" onclick="document.getElementById('photoInput').click()">📁 选择照片</button>
      <button class="btn btn-secondary" onclick="closePhotoModal()">取消</button>
    </div>
  </div>
</div>

<script>
// =============================================
// 20 questions, 4 options each
// 5 dimensions: E/I, N/S, T/F, P/J, H/L
// E/I 社交家/独行侠  N/S 探索家/现实派  T/F 理性派/感性派
// P/J 随性派/规律派  H/L 猎手/面包
// =============================================

const questions = [
  // — E/I (社交 vs 独处) —
  {
    dim: '社交', emoji: '🚪',
    text: '门铃响了，外卖到了。你的猫？',
    opts: [
      { e:'😼', t:'第一时间冲到门口，看看是不是猫条来了', v:'E' },
      { e:'🧐', t:'远远蹲着观察，确认安全再靠近', v:'E' },
      { e:'😴', t:'躺在原地不动，又不是罐罐响', v:'I' },
      { e:'🏃', t:'瞬间消失，躲进床底或衣柜深处', v:'I' },
    ]
  },
  {
    dim: '社交', emoji: '🧑‍🤝‍🧑',
    text: '朋友第一次来家里做客，你的猫？',
    opts: [
      { e:'🐕', t:'主动蹭客人的腿，翻肚皮求摸', v:'E' },
      { e:'🐱', t:'保持距离但不出房间，暗中观察', v:'E' },
      { e:'👀', t:'躲在角落探头探脑，等人走了才出来', v:'I' },
      { e:'🙈', t:'全程隐身，仿佛家里根本没养猫', v:'I' },
    ]
  },
  {
    dim: '社交', emoji: '🏥',
    text: '带出门去宠物医院，在猫包里？',
    opts: [
      { e:'🌍', t:'好奇地东张西望，甚至想钻出来探索', v:'E' },
      { e:'😗', t:'小声喵几句但不算太紧张', v:'E' },
      { e:'🥺', t:'缩成一团，眼睛瞪大，偶尔发抖', v:'I' },
      { e:'😱', t:'全程飞机耳+张嘴喘气，吓到石化', v:'I' },
    ]
  },
  {
    dim: '社交', emoji: '🐈',
    text: '路上偶遇一只陌生猫，你的猫？',
    opts: [
      { e:'🤝', t:'凑上去闻鼻子，友好社交', v:'E' },
      { e:'😼', t:'保持距离但好奇地盯着看', v:'E' },
      { e:'😤', t:'炸毛哈气，警告对方别过来', v:'I' },
      { e:'💨', t:'扭头就跑，跑得比什么都快', v:'I' },
    ]
  },

  // — N/S (探索 vs 务实) —
  {
    dim: '探索', emoji: '🧸',
    text: '买了一个会自己动的电动老鼠玩具？',
    opts: [
      { e:'🤩', t:'疯狂扑上去，叼起来满屋子跑', v:'N' },
      { e:'🐾', t:'谨慎地用爪子拨拉几下，试试反应', v:'N' },
      { e:'😒', t:'闻了闻，确认不是吃的，转身走开', v:'S' },
      { e:'😴', t:'完全不感兴趣，继续睡自己的觉', v:'S' },
    ]
  },
  {
    dim: '探索', emoji: '📦',
    text: '快递到了，地上多了一个空纸箱？',
    opts: [
      { e:'🎉', t:'火速钻进去，并宣布这是新领地', v:'N' },
      { e:'🕵️', t:'先绕纸箱侦察三圈，再决定进不进去', v:'N' },
      { e:'🤔', t:'闻一闻，然后毫无兴趣地走开', v:'S' },
      { e:'🙅', t:'纸箱？不感兴趣，除非里面装过吃的', v:'S' },
    ]
  },
  {
    dim: '探索', emoji: '🪟',
    text: '窗外飞过一只鸟，停在窗台上？',
    opts: [
      { e:'🦁', t:'立刻进入狩猎模式，发出咔咔咔的声音', v:'N' },
      { e:'👀', t:'眼睛锁定目标，尾巴开始兴奋地甩', v:'N' },
      { e:'😐', t:'抬头看一眼，确认不是吃的，继续舔毛', v:'S' },
      { e:'💤', t:'压根没注意到，睡得正香', v:'S' },
    ]
  },
  {
    dim: '探索', emoji: '🪑',
    text: '家里重新布置了家具位置？',
    opts: [
      { e:'🗺️', t:'兴奋！新地图！立刻巡逻并标记新领土', v:'N' },
      { e:'🧐', t:'好奇地探索新布局，在每件家具上蹭蹭', v:'N' },
      { e:'😕', t:'有点困惑但很快适应，接着睡觉', v:'S' },
      { e:'😠', t:'明显不开心，在原来放沙发的地方来回转', v:'S' },
    ]
  },

  // — T/F (理性 vs 感性) —
  {
    dim: '感性', emoji: '😢',
    text: '你因为工作/感情崩溃大哭？',
    opts: [
      { e:'❤️', t:'立刻跑来蹭你、舔你手心，安静守在你身边', v:'F' },
      { e:'🐾', t:'走过来趴在你腿上，用呼噜声安慰你', v:'F' },
      { e:'🤨', t:'远远看一眼，确认不是猫条没了就继续睡', v:'T' },
      { e:'😑', t:'完全无视，甚至觉得你有点吵', v:'T' },
    ]
  },
  {
    dim: '感性', emoji: '🤗',
    text: '你强行把猫抱起来吸？',
    opts: [
      { e:'🥰', t:'立刻开始呼噜，眯眼睛，甚至踩奶', v:'F' },
      { e:'😊', t:'不反抗但也不享受，给你面子忍十秒', v:'F' },
      { e:'😒', t:'挣扎着想下地，浑身写着「放我下来」', v:'T' },
      { e:'😾', t:'直接推开你的脸，必要时上爪子', v:'T' },
    ]
  },
  {
    dim: '感性', emoji: '💼',
    text: '你换好衣服准备出门上班？',
    opts: [
      { e:'😿', t:'蹲在门口/行李箱上，试图用眼神挽留你', v:'F' },
      { e:'🐾', t:'在你脚边绕来绕去，想让你多留一会儿', v:'F' },
      { e:'😐', t:'淡定看着你出门，等你走了正好独享沙发', v:'T' },
      { e:'🎉', t:'你终于走了！立刻开始跑酷庆祝自由', v:'T' },
    ]
  },
  {
    dim: '感性', emoji: '🍗',
    text: '你在吃炸鸡，猫在远处看着？',
    opts: [
      { e:'🥺', t:'用最无辜的眼神盯着你，让你不忍心不给', v:'F' },
      { e:'🐱', t:'凑过来蹭你腿卖萌，试图换取一口鸡肉', v:'F' },
      { e:'😼', t:'直接跳上桌，准备自己动手丰衣足食', v:'T' },
      { e:'😤', t:'不屑地看了你一眼——这都不是罐罐', v:'T' },
    ]
  },

  // — P/J (随性 vs 规律) —
  {
    dim: '生活', emoji: '🍽️',
    text: '关于吃饭这件事？',
    opts: [
      { e:'🎲', t:'自助餐模式，碗里永远有粮，饿了就吃几口', v:'P' },
      { e:'⏰', t:'一天三顿定时喂，到点没放饭会小声催促', v:'P' },
      { e:'📢', t:'到点必须开饭，晚一分钟就开始大声投诉', v:'J' },
      { e:'👑', t:'有严格的用餐 SOP，食物摆放位置都不能错', v:'J' },
    ]
  },
  {
    dim: '生活', emoji: '😴',
    text: '睡觉这件事情？',
    opts: [
      { e:'🎪', t:'全屋都是我的床，每天随机挑选幸运地点', v:'P' },
      { e:'🔄', t:'有 5-6 个常用据点，不定期轮换', v:'P' },
      { e:'📍', t:'每天固定睡三个地方，雷打不动', v:'J' },
      { e:'🗓️', t:'连午觉和晚觉的地点都有明确区分', v:'J' },
    ]
  },
  {
    dim: '生活', emoji: '🧹',
    text: '你刚铲完猫砂，换上干净的？',
    opts: [
      { e:'💩', t:'立刻进去拉一泡，用行动表达感谢', v:'P' },
      { e:'🎉', t:'进去打滚玩沙，顺便上个厕所', v:'P' },
      { e:'✅', t:'优雅地使用，仪式感满满', v:'J' },
      { e:'🤌', t:'必须等猫砂铺平到标准厚度才肯用', v:'J' },
    ]

let catName = '';
let scores = { E:0, I:0, N:0, S:0, T:0, F:0, P:0, J:0, H:0, L:0 };
let currentQ = 0;
let catPhoto = null;

const dimNames = {
  '社交': '社交倾向', '探索': '探索精神', '感性': '情感温度', '生活': '生活态度', '野性': '野性指数'
};

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startQuiz() {
  const input = document.getElementById('catNameInput');
  catName = input.value.trim() || '我家猫';
  scores = { E:0, I:0, N:0, S:0, T:0, F:0, P:0, J:0, H:0, L:0 };
  currentQ = 0;
  showScreen('screen-quiz');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQ];
  document.getElementById('stepText').textContent = `${currentQ + 1}/20`;
  document.getElementById('progressFill').style.width = `${(currentQ / 20) * 100}%`;
  document.getElementById('dimBadge').textContent = dimNames[q.dim] || '';
  document.getElementById('qEmoji').textContent = q.emoji;
  document.getElementById('qText').textContent = q.text;

  const optsEl = document.getElementById('optionsEl');
  optsEl.innerHTML = '';
  const shuffled = [...q.opts].sort(() => Math.random() - 0.5);
  shuffled.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = `<span class="opt-emoji">${opt.e}</span>${opt.t}`;
    btn.onclick = () => answerQuestion(opt.v);
    optsEl.appendChild(btn);
  });
}

function answerQuestion(value) {
  scores[value]++;
  currentQ++;
  if (currentQ >= questions.length) {
    showResult();
  } else {
    renderQuestion();
    document.getElementById('progressFill').style.width = `${(currentQ / 20) * 100}%`;
    document.getElementById('stepText').textContent = `${currentQ + 1}/20`;
  }
}

function computeType() {
  return (scores.E >= scores.I ? 'E' : 'I') +
         (scores.N >= scores.S ? 'N' : 'S') +
         (scores.T >= scores.F ? 'T' : 'F') +
         (scores.P >= scores.J ? 'P' : 'J') +
         (scores.H >= scores.L ? 'H' : 'L');
}

function dimBar(label, left, right, leftScore, rightScore) {
  const total = leftScore + rightScore || 1;
  const leftPct = Math.round((leftScore / total) * 100);
  const winner = leftScore >= rightScore ? left : right;
  return { label, left, right, leftScore, rightScore, leftPct, winner };
}

    const w = b.winner;
    if (w.includes('E')) tips.push({ e:'🎉', t:'它是社交型猫猫——多邀请朋友来家里、多跟它说话互动，它会很开心，甚至会主动参与你的聚会。' });
    if (w.includes('I')) tips.push({ e:'🏠', t:'它是独处型猫猫——给它准备几个安静的藏身角落（纸箱、猫窝隧道），不要强行社交，让它自己决定什么时候来找你。' });
    if (w.includes('N')) tips.push({ e:'🧸', t:'它充满好奇心——定期更换玩具、增加新纸箱、偶尔变换家里的小布置，它需要新鲜感的刺激。' });
    if (w.includes('S')) tips.push({ e:'☀️', t:'它是务实派——它重视稳定的环境，熟悉的窝、固定的晒太阳位置比新玩具更能给它安全感。' });
    if (w.includes('F')) tips.push({ e:'💕', t:'它是感性猫猫——它需要你的回应。多摸摸它、跟它说说话、回应它的蹭蹭和呼噜，情感连接对它是必需品。' });
    if (w.includes('T')) tips.push({ e:'🤝', t:'它是理性猫猫——尊重它的独立空间，它来找你的时候你再回应，不要强抱强亲。它用行动表达爱，不需要太多仪式感。' });
    if (w.includes('P')) tips.push({ e:'🎪', t:'它是随性自由派——不要试图给它排作息表，接受它凌晨跑酷、随心所欲的生活节奏。灵活响应就是最好的相处方式。' });
    if (w.includes('J')) tips.push({ e:'⏰', t:'它是规律主义者——固定时间喂食、固定时间陪玩，任何变动都可能让它焦虑。建立一个可预测的日常，它会更安心。' });
    if (w.includes('H')) tips.push({ e:'🏹', t:'它是天生的猎手——每天至少要陪它玩逗猫棒或扔球 15 分钟，满足它的捕猎本能。漏食玩具、嗅闻垫也是好选择。' });
    if (w.includes('L')) tips.push({ e:'🛋️', t:'它是佛系面包——不要强迫它运动。在它喜欢瘫着的地方多放软垫，偶尔用零食引导它动一动就够了，尊重它的慢节奏。' });
  });
  return tips;
}

function showResult() {
  const type = computeType();
  const r = results[type] || Object.values(results)[0];

  document.getElementById('resultType').textContent = `🐾 猫格类型 · ${type}`;
  document.getElementById('resultName').textContent = r.name;
  document.getElementById('resultRole').textContent = r.role;
  document.getElementById('resultDesc').textContent = r.desc;
  document.getElementById('catSay').textContent = r.say;

  // Traits
  document.getElementById('traitsEl').innerHTML = r.traits.map(t => `<span class="trait">${t}</span>`).join('');

  // Score bars
  const bars = [
    dimBar('社交', '外向 E', '内向 I', scores.E, scores.I),
    dimBar('探索', '直觉 N', '实感 S', scores.N, scores.S),
    dimBar('感性', '情感 F', '理性 T', scores.F, scores.T),
    dimBar('生活', '随性 P', '规律 J', scores.P, scores.J),
    dimBar('野性', '猎手 H', '面包 L', scores.H, scores.L),
  ];
  document.getElementById('scoreBars').innerHTML = bars.map(b => `
    <div class="score-row">
      <span>${b.label}</span>
      <span class="dim-label ${b.winner === b.left ? 'winner' : ''}">${b.left}</span>
      <span style="font-size:11px">${b.leftScore}</span>
      <div class="bar-wrap">
        <div class="bar-left" style="width:${b.leftPct}%"></div>
        <div class="bar-right" style="width:${100-b.leftPct}%"></div>
      </div>
      <span style="font-size:11px">${b.rightScore}</span>
      <span class="dim-label ${b.winner === b.right ? 'winner' : ''}">${b.right}</span>
    </div>
  `).join('');

  // 相处建议
  const tips = getTips(bars);
  document.getElementById('tipsSection').innerHTML = `
    <div class="tips-title">💡 和 ${catName} 相处的小建议</div>
    ${tips.map(t => `<div class="tip-item"><span class="tip-emoji">${t.e}</span><span>${t.t}</span></div>`).join('')}
  `;

  // ID Card
  document.getElementById('cardCatName').textContent = catName;
  document.getElementById('cardType').textContent = `${type} · ${r.name}`;
  document.getElementById('cardOneliner').textContent = r.role;
  document.getElementById('cardDate').textContent = new Date().toLocaleDateString('zh-CN', { year:'numeric', month:'long', day:'numeric' });

  updatePhotoArea();
  showScreen('screen-result');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Photo
function showPhotoModal() { document.getElementById('photoModal').classList.add('show'); }
function closePhotoModal() { document.getElementById('photoModal').classList.remove('show'); }
function handlePhotoSelect(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) { catPhoto = e.target.result; updatePhotoArea(); closePhotoModal(); };
  reader.readAsDataURL(file);
}
function updatePhotoArea() {
  document.getElementById('photoArea').innerHTML = catPhoto
    ? `<img src="${catPhoto}" alt="猫猫照片">`
    : '<span class="placeholder">📷</span>';
}

function restartQuiz() { catPhoto = null; document.getElementById('catNameInput').value = ''; showScreen('screen-welcome'); }

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function downloadCard() {
  const card = document.getElementById('idCard');
  const scale = 2;
  const pad = 24;
  const photoS = 85, photoR = 16;
  const photoX = pad, photoY = pad + 6;
  const textX = photoX + photoS + 18;
  const w = card.offsetWidth, h = card.offsetHeight;
  const type = computeType();
  const r = results[type];
  const today = new Date().toLocaleDateString('zh-CN', { year:'numeric', month:'long', day:'numeric' });

  const canvas = document.createElement('canvas');
  canvas.width = w * scale;
  canvas.height = h * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  // Card bg
  const grad = ctx.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, '#FFFEF9');
  grad.addColorStop(1, '#FFF8EE');
  roundRect(ctx, 0, 0, w, h, 20);
  ctx.fillStyle = grad; ctx.fill();
  ctx.strokeStyle = '#D4A853'; ctx.lineWidth = 3; ctx.stroke();

  // Footer divider
  ctx.beginPath();
  ctx.setLineDash([4, 4]);
  ctx.moveTo(pad, h - 44);
  ctx.lineTo(w - pad, h - 44);
  ctx.strokeStyle = '#E8D5C4'; ctx.lineWidth = 1; ctx.stroke();
  ctx.setLineDash([]);

  // Footer text
  ctx.fillStyle = '#C4A882'; ctx.font = '10px -apple-system, sans-serif';
  ctx.fillText(today, pad, h - 18);
  ctx.textAlign = 'right';
  ctx.fillText('猫格身份证', w - pad, h - 18);
  ctx.textAlign = 'left';

  function drawTexts() {
    // Name
    ctx.fillStyle = '#4A3728'; ctx.font = 'bold 20px -apple-system, sans-serif';
    ctx.fillText(catName, textX, photoY + 30);

    // Type badge
    const typeStr = `${type} · ${r.name}`;
    ctx.font = '12px -apple-system, sans-serif';
    const tm = ctx.measureText(typeStr);
    const tagW = tm.width + 20, tagH = 22, tagY = photoY + 46;
    roundRect(ctx, textX, tagY, tagW, tagH, 11);
    ctx.fillStyle = '#FFF0E0'; ctx.fill();
    ctx.fillStyle = '#E8923E'; ctx.fillText(typeStr, textX + 10, tagY + 15);

    // Role one-liner
    ctx.fillStyle = '#8B7355'; ctx.font = '12px -apple-system, sans-serif';
    ctx.fillText(r.role, textX, tagY + 38);

    // Done → trigger download
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.download = `${catName}-猫格身份证.png`;
      a.href = url; a.click();
      URL.revokeObjectURL(url);
    }, 'image/png');
  }

  // Photo
  roundRect(ctx, photoX, photoY, photoS, photoS, photoR);
  ctx.save(); ctx.clip();
  if (catPhoto) {
    const img = new Image();
    img.onload = function() {
      ctx.drawImage(img, photoX, photoY, photoS, photoS);
      ctx.restore();
      drawTexts();
    };
    img.src = catPhoto;
  } else {
    ctx.fillStyle = '#FFF0E0'; ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#C4A882'; ctx.font = '32px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('📷', photoX + photoS / 2, photoY + photoS / 2 + 11);
    ctx.textAlign = 'left';
    drawTexts();
  }
}

async function shareCard() {
  const type = computeType();
  const r = results[type];
  const link = window.location.href.startsWith('http') ? window.location.href : '';
  const linkLine = link ? `\n来测 → ${link}` : '';
  const text = `🐱 ${catName}的猫格是 ${type} · ${r.name}！\n${r.role}${linkLine}`;
  try {
    if (navigator.share) {
      const shareData = { title: `${catName}的猫格身份证`, text };
      if (link) shareData.url = link;
      await navigator.share(shareData);
      return;
    }
  } catch(e) {}
  try {
    await navigator.clipboard.writeText(text);
    alert('已复制分享文案和链接，去粘贴给猫友吧！');
  } catch(e) {
    alert('分享暂不可用，可以截图发给朋友哦 📸');
  }
}

document.getElementById('photoModal').addEventListener('click', function(e) {
  if (e.target === this) closePhotoModal();
});
